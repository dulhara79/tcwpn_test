# ---------------------------------------------------------------------------
# Reusable quality gate.
#
# Leading underscore = reusable / not directly triggerable. Called by both
# ci.yml (on PRs) and sync-to-monorepo.yml (before any mirror push), so the
# exact same bar is enforced in both paths and cannot drift.
# ---------------------------------------------------------------------------
name: _quality-gate

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for lint and test jobs.
        required: false
        type: string
        default: "3.11"
      run-tests:
        description: Set false to skip pytest (lint + guards still run).
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1. Static analysis. Fast, no heavy deps.
  # -------------------------------------------------------------------------
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install linters
        run: python -m pip install --upgrade pip ruff==0.6.9 black==24.10.0

      - name: Resolve lint targets
        id: targets
        run: |
          set -euo pipefail
          T=""
          for d in src tests scripts; do
            [ -d "$d" ] && T="$T $d"
          done
          if [ -z "$T" ]; then
            echo "::error::No lintable source directories found."
            exit 1
          fi
          echo "dirs=$T" >> "$GITHUB_OUTPUT"

      - name: Ruff (lint)
        run: ruff check ${{ steps.targets.outputs.dirs }}

      - name: Black (format check)
        run: black --check --diff ${{ steps.targets.outputs.dirs }}

  # -------------------------------------------------------------------------
  # 2. Repository guards. This is the gate that protects the PUBLIC monorepo
  #    from MIMIC-IV / NHSL material, giant checkpoints and stray credentials.
  #    Runs before anything is ever mirrored.
  # -------------------------------------------------------------------------
  guards:
    name: Repository guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install guard deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Run guards
        run: python .github/sync/guards.py --config .github/sync/sync.config.yml

  # -------------------------------------------------------------------------
  # 3. Tests. Heaviest job; cached so torch/transformers aren't rebuilt daily.
  # -------------------------------------------------------------------------
  test:
    name: Tests (py${{ inputs.python-version }})
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner install to ~2 min instead of ~12.
          pip install --index-url https://download.pytorch.org/whl/cpu torch || true
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov

      - name: Pytest
        env:
          # Never let a CI run reach for real clinical data or remote hubs.
          TCWPN_ENV: ci
          HF_HUB_OFFLINE: "0"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          pytest tests \
            --cov=src/tcwpn \
            --cov-report=term-missing \
            --cov-report=xml \
            -m "not slow and not requires_data" \
            -q

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ inputs.python-version }}
          path: coverage.xml
          retention-days: 14
          if-no-files-found: ignore