# ---------------------------------------------------------------------------
# Push to main in tcwpn_test  ->  pull request into R26-DS-012
#
# Copies this repo into R26-DS-012/Anxiety_Detection_TC_WPN/ and opens a PR.
# No lint. No tests. It just moves the code.
#
# Only Anxiety_Detection_TC_WPN/ is ever touched. The other components'
# folders are not readable or writable by this job.
# ---------------------------------------------------------------------------
name: sync-to-monorepo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two quick pushes queue up instead of racing each other.
concurrency:
  group: sync-tcwpn
  cancel-in-progress: false

env:
  TARGET_REPO: dulhara79/R26-DS-012
  TARGET_BASE: main
  MIRROR_ROOT: Anxiety_Detection_TC_WPN
  SYNC_BRANCH: sync/tcwpn/main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tcwpn_test
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout R26-DS-012
        uses: actions/checkout@v4
        with:
          repository: dulhara79/R26-DS-012
          token: ${{ secrets.MONOREPO_SYNC_TOKEN }}
          path: monorepo
          fetch-depth: 0

      # Always rebuild the sync branch from the latest main, so if another
      # component merges something while your PR is open, it is not reverted.
      - name: Reset sync branch to latest main
        working-directory: monorepo
        run: |
          set -euo pipefail
          git config user.name  "tcwpn-sync[bot]"
          git config user.email "tcwpn-sync@users.noreply.github.com"
          git fetch origin --prune
          git checkout -B "$SYNC_BRANCH" "origin/$TARGET_BASE"

      # rsync is scoped to the mirror root, so nothing outside
      # Anxiety_Detection_TC_WPN/ can change.
      #
      # The excludes are not checks and cannot fail the build. They just keep
      # clinical data and model weights out of the public monorepo.
      - name: Copy code
        run: |
          set -euo pipefail
          mkdir -p "monorepo/${MIRROR_ROOT}"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='data/' \
            --exclude='*.csv' \
            --exclude='*.parquet' \
            --exclude='*.jsonl' \
            --exclude='*.pt' \
            --exclude='*.pth' \
            --exclude='*.pkl' \
            --exclude='*.bin' \
            --exclude='*.safetensors' \
            --exclude='*.ckpt' \
            --exclude='checkpoints/' \
            --exclude='outputs/' \
            --exclude='wandb/' \
            --exclude='.env' \
            --exclude='__pycache__/' \
            --exclude='.ipynb_checkpoints/' \
            --exclude='.venv/' \
            --exclude='.pytest_cache/' \
            --exclude='.ruff_cache/' \
            source/ "monorepo/${MIRROR_ROOT}/"

      - name: Stage changes
        id: stage
        working-directory: monorepo
        run: |
          set -euo pipefail
          git add -A -- "$MIRROR_ROOT"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date, nothing to sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat | tail -n 30
          fi

      - name: Commit and push
        if: steps.stage.outputs.changed == 'true'
        working-directory: monorepo
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          git commit -m "chore(sync): update TC-WPN from tcwpn_test@${SHORT_SHA}"
          git push --force origin "HEAD:refs/heads/${SYNC_BRANCH}"

      # Deterministic branch name means a second sync updates the SAME pull
      # request instead of opening a competing one.
      - name: Open or update pull request
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TITLE="Update TC-WPN component (tcwpn_test@${SHORT_SHA})"
          BODY="Automated sync of \`Anxiety_Detection_TC_WPN/\` from ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

          Only \`Anxiety_Detection_TC_WPN/\` is modified. Other components are untouched.

          Note: this branch is rebuilt on every sync, so do not commit to it directly."

          EXISTING=$(gh pr list --repo "$TARGET_REPO" --head "$SYNC_BRANCH" \
                       --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$TARGET_REPO" --title "$TITLE" --body "$BODY"
            gh pr view "$EXISTING" --repo "$TARGET_REPO" --json url --jq .url
          else
            gh pr create --repo "$TARGET_REPO" \
              --base "$TARGET_BASE" --head "$SYNC_BRANCH" \
              --title "$TITLE" --body "$BODY"
          fi