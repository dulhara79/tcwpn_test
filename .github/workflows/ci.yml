# ---------------------------------------------------------------------------
# Continuous integration for dulhara79/tcwpn_test.
#
# Runs on every PR into main and on every push to main. Make the three
# check names below REQUIRED in branch protection so nothing lands on main
# that would then be mirrored into the monorepo.
# ---------------------------------------------------------------------------
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One CI run per branch/PR; superseded runs are cancelled to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/_quality-gate.yml
    with:
      python-version: "3.11"
      run-tests: true

  # Cheap sanity check that the mirror would produce a sane tree, without
  # touching the monorepo. Gives you the diff preview inside the PR itself.
  sync-dry-run:
    name: Mirror dry run
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip pyyaml

      - name: Compute mirror payload
        id: payload
        run: |
          python .github/sync/guards.py \
            --config .github/sync/sync.config.yml \
            --print-manifest > mirror-manifest.txt
          echo "files=$(wc -l < mirror-manifest.txt)" >> "$GITHUB_OUTPUT"
          echo "bytes=$(awk '{s+=$1} END {print s+0}' mirror-manifest.txt)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Mirror dry run"
            echo ""
            echo "- Files that would be mirrored: **${{ steps.payload.outputs.files }}**"
            echo "- Total size: **${{ steps.payload.outputs.bytes }} bytes**"
            echo ""
            echo "<details><summary>Manifest</summary>"
            echo ""
            echo '```'
            cat mirror-manifest.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"